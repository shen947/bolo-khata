# One-click deploy: https://render.com/deploy?repo=https://github.com/shen947/bolo-khata
services:
  - type: web
    name: bolo-khata
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8000"
      - key: COOKIE_SECURE
        value: "true"
