<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#A51C24">
  <title>Bolo Khata · बोलो खाता</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">बो</span>
      <div>
        <div class="brand-name">बोलो खाता</div>
        <div class="shop" id="shopName"></div>
      </div>
    </div>
    <div class="langs" role="radiogroup" aria-label="Language">
      <button data-lang="hi" role="radio">हिं</button>
      <button data-lang="mr" role="radio">मरा</button>
      <button data-lang="en" role="radio">EN</button>
    </div>
  </header>
  <div id="offline" class="offline" hidden></div>

  <main id="view"></main>

  <nav class="tabs">
    <a href="#/" data-tab="home"><span class="ti">🎙</span><span data-t="nav_home"></span></a>
    <a href="#/customers" data-tab="customers"><span class="ti">📒</span><span data-t="nav_khata"></span></a>
  </nav>

  <!-- confirmation / question sheet -->
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-card" role="dialog" aria-live="polite" id="sheetCard"></div>
  </div>
  <div id="toast" class="toast" hidden></div>

  <script src="/static/app.js"></script>
</body>
</html>
